workflows:
  ios-kivy:
    name: Kivy iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 16.4

    scripts:
      - name: Install Python dependencies
        script: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install kivy-ios

      - name: Build Kivy for iOS
        script: |
          source venv/bin/activate
          pip install Cython
          brew install automake
          toolchain build kivy

      - name: Create Xcode project
        script: |
          source venv/bin/activate

          mkdir -p "$CM_BUILD_DIR/kivy_app"
          cp "$CM_BUILD_DIR/main.py" "$CM_BUILD_DIR/kivy_app/main.py"

          toolchain create QuanLyThuChi "$CM_BUILD_DIR/kivy_app"

      - name: Build iOS app
        script: |
          cd "$CM_BUILD_DIR/QuanLyThuChi-ios"

          xcodebuild \
            -project "quanlythuchi.xcodeproj" \
            -scheme "quanlythuchi" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Release-iphoneos/quanlythuchi.app" \
            -type d | head -1)

          echo "Found app at: $APP_PATH"

          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"
          zip -r QuanLyThuChi.ipa Payload

    artifacts:
      - "$CM_BUILD_DIR/QuanLyThuChi.ipa"
      - /tmp/xcodebuild_logs/*.log
